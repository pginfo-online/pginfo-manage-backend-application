services:
  postgres:
    image: postgres:16-alpine
    container_name: pginfo_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: pginfo
      POSTGRES_PASSWORD: pginfo_dev
      POSTGRES_DB: pginfo_dev
    volumes:
      - pginfo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pginfo -d pginfo_dev']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: pginfo_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - pginfo_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pginfo_postgres_data:
  pginfo_redis_data:
