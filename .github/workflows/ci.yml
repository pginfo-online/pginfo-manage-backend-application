name: Backend CI and production deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Apply migrations: confirm reviewed SQL, restorable backup, and backward compatibility first'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: backend-checks-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      release: ${{ steps.release.outputs.id }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pginfo
          POSTGRES_PASSWORD: pginfo_dev
          POSTGRES_DB: pginfo_dev
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U pginfo -d pginfo_dev" --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://pginfo:pginfo_dev@localhost:5432/pginfo_dev
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: ci-only-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-only-refresh-secret-at-least-32-characters
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0
          run_install: false
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma and migrate disposable CI database
        run: |
          pnpm prisma generate
          pnpm prisma migrate deploy
      - name: Format, lint, types, unit tests, and compilation
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: HTTP integration test
        run: pnpm test:e2e
      - name: Deployment isolation and rollback tests
        run: python3 -m unittest discover -s deploy/tests -v
      - name: Immutable release identifier
        id: release
        run: echo "id=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build Linux production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pginfo-backend:${{ steps.release.outputs.id }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/pginfo-online/pginfo-manage-backend-application
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
      - name: Exercise API, worker, Redis, and migrations in isolation
        env:
          RELEASE_TAG: ${{ steps.release.outputs.id }}
        run: |
          docker compose -f deploy/compose.smoke.yml up -d --wait postgres redis
          docker compose -f deploy/compose.smoke.yml run --rm migrate
          docker compose -f deploy/compose.smoke.yml up -d --wait --wait-timeout 180 api worker
          docker compose -f deploy/compose.smoke.yml exec -T api node deploy/verify-runtime.mjs
          curl --fail --silent --show-error http://127.0.0.1:3189/health/ready
      - name: Smoke-test diagnostics on failure
        if: failure() && steps.release.outputs.id != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.id }}
        run: docker compose -f deploy/compose.smoke.yml logs --tail=80
      - name: Remove disposable smoke-test services
        if: always() && steps.release.outputs.id != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.id }}
        run: docker compose -f deploy/compose.smoke.yml down -v
      - name: Package tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          mkdir bundle
          docker image save "pginfo-backend:$RELEASE_ID" | gzip -1 > bundle/image.tar.gz
          python3 - <<'PY'
          import json, os, pathlib
          release = os.environ['RELEASE_ID']
          pathlib.Path('bundle/metadata.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'], 'release': release,
              'image': 'pginfo-backend:' + release,
          }))
          PY
          tar -cf release.tar -C bundle image.tar.gz metadata.json
      - name: Retain tested release artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ steps.release.outputs.id }}
          path: release.tar
          retention-days: 3
          compression-level: 0

  deploy:
    name: Deploy production
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://pginfo.space
    concurrency:
      group: pginfo-production
      cancel-in-progress: false
    steps:
      - name: Download image tested by this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-${{ needs.checks.outputs.release }}
      - name: Upload and deploy through restricted SSH gateway
        env:
          RELEASE_ID: ${{ needs.checks.outputs.release }}
          DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations && 'true' || 'false' }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts"
          ssh_args=(-i "$key" -p "$VPS_PORT" -o IdentitiesOnly=yes -o BatchMode=yes
                    -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts"
                    -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "receive $RELEASE_ID" < release.tar
          ssh "${ssh_args[@]}" "$VPS_USER@$VPS_HOST" "deploy $RELEASE_ID $APPLY_MIGRATIONS"
          curl --resolve "pginfo.space:443:$VPS_HOST" --retry 3 --retry-delay 3 \
            --max-time 20 --fail --silent --show-error https://pginfo.space/health/ready
          printf '\nDeployed commit %s to https://pginfo.space\n' "${RELEASE_ID:0:40}" >> "$GITHUB_STEP_SUMMARY"
