# ==============================================================================
# Nginx Configuration for PgInfo Manage Backend (api.pginfo.business)
# ==============================================================================
# Place this file in /etc/nginx/sites-available/api.pginfo.business
# and symlink to /etc/nginx/sites-enabled/
#
# IMPORTANT: Rate limit zones use unique names (pginfo_manage_*) to avoid 
# colliding with any existing Nginx sites on this VPS.
# ==============================================================================

# Unique Rate Limit Zones (must be at http level or outside server block)
limit_req_zone $binary_remote_addr zone=pginfo_manage_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=pginfo_manage_auth:10m rate=10r/m;

# ── HTTP: ACME Challenge & SSL Redirect ─────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.pginfo.business;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: Secure Reverse Proxy ──────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.pginfo.business;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.pginfo.business/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pginfo.business/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # File upload size limit (allows up to 25MB for KYC docs & property images)
    client_max_body_size 25M;
    limit_req_status 429;

    # Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;

    # Health Checks (unthrottled for monitoring)
    location ~ ^/health(/.*)?$ {
        proxy_pass http://127.0.0.1:3109;
    }

    # Authentication Endpoints (strict rate limiting against brute-force)
    location ~* ^/api/v1/auth/(login|register|refresh)/?$ {
        limit_req zone=pginfo_manage_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3109;
    }

    # Webhook Endpoints (MUST NOT be rate limited; payment gateways retry on fail)
    # Compatibility for Razorpay configurations created before the /api/v1 prefix.
    location = /v1/webhooks/razorpay {
        proxy_pass http://127.0.0.1:3109/api/v1/webhooks/razorpay;
    }

    location /api/v1/webhooks/ {
        proxy_pass http://127.0.0.1:3109;
    }

    # Default API Traffic
    location / {
        limit_req zone=pginfo_manage_api burst=50 nodelay;
        proxy_pass http://127.0.0.1:3109;
    }
}
